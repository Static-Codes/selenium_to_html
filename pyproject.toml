[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "selenium_to_html"
version = "0.1.0"
description = "Hardened extension of Selenium's page_source. Supports synchronous and asynchronous captures with a concurrent, layered-approach to the fetching of linked resources. Includes optional media embedding support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "selenium>=4.0",
]
keywords = ["selenium_python", "hardened_selenium", "scraping", "selenium_extensions", "selenium_python3"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP",
]

# The name of the root package directory.
[tool.flit.module]
name = "selenium_to_html"